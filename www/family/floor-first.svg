<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480">
  <style>
    polygon, rect { stroke: #8e949c; stroke-width: 3; stroke-linejoin: round; }
    text { font-family: sans-serif; fill: #8e949c; text-anchor: middle; }
    .n { font-size: 15px; font-weight: 700; }
    .d { font-size: 11px; }
  </style>

  <!-- Bedroom 2 (rear left) -->
  <rect fill="rgba(255,193,7,.14)" x="21" y="20" width="174" height="195"/>
  <text class="n" x="108" y="82">BEDROOM 2</text>
  <text class="d" x="108" y="100">3.12 x 2.72 m</text>

  <!-- Bedroom 3 (rear right) -->
  <rect fill="rgba(255,193,7,.14)" x="203" y="20" width="135" height="138"/>
  <text class="n" x="270" y="56">BEDROOM 3</text>
  <text class="d" x="270" y="74">2.18 x 2.18 m</text>

  <!-- Landing + stairs down -->
  <polygon fill="rgba(142,148,156,.1)" points="200,158 338,158 338,305 228,305 228,225 200,225"/>
  <text class="n" x="269" y="190">LANDING</text>
  <text class="d" x="300" y="240">DOWN</text>

  <!-- Bedroom 1 (front, with bay) -->
  <polygon fill="rgba(255,193,7,.14)" points="21,225 220,225 220,425 200,447 40,447 21,425"/>
  <text class="n" x="120" y="290">BEDROOM 1</text>
  <text class="d" x="120" y="308">3.61 x 3.10 m</text>

  <!-- Bathroom (front right) -->
  <rect fill="rgba(33,150,243,.16)" x="228" y="305" width="110" height="115"/>
  <text class="n" x="283" y="335">BATH</text>

  <text class="d" x="180" y="470">FRONT</text>
</svg>

# FAMILY HOMEPAGE
# Edit this file and every screen updates within a second or two.
# Everything not under pages:/people:/rooms: stays on the server, so it is
# safe to put private calendar links, device addresses and keys here.

title: Our House
locale: en-GB              # date and time style
timezone: Europe/London
theme: auto                # auto (follow the device), dark or light
scale: auto                # auto scales 4K/large screens up; or a number, e.g. 2
idle_return: 120           # seconds before the tablet goes back to the first page (0 = never)

# Everyone in the house. id is used by chores; photo is optional
# (put images in config/assets/ and use /assets/name.jpg).
people:
  - { id: person1, name: Person 1, color: '#4f8cff' }
  - { id: person2, name: Person 2, color: '#f2994a' }
  - { id: person3, name: Person 3, color: '#27ae60' }

# Rooms. id matches the room shapes in the house plans (room_<id>) and the
# 3D model; short is the label on the plan.
rooms:
  - { id: living_dining, name: Sitting / Dining Room, short: Living }
  - { id: kitchen, name: Kitchen }
  - { id: hall, name: Hall }
  - { id: store, name: Under-stairs store, short: Store }
  - { id: landing, name: Landing }
  - { id: bedroom_1, name: Bedroom 1, short: Bed 1 }
  - { id: bedroom_2, name: Bedroom 2, short: Bed 2 }
  - { id: bedroom_3, name: Bedroom 3, short: Bed 3 }
  - { id: bathroom, name: Bathroom, short: Bath }
  - { id: garden, name: Garden }

# SMART DEVICES
# Each device has a name, a room, a type (light, switch, fan, sensor,
# climate, cover) and a connection under via:. The ones below are
# "virtual" (they only exist on screen) so you can try everything out.
# Swap via: for your real devices, for example:
#   via: { zigbee2mqtt: Kitchen ceiling }        Zigbee2MQTT friendly name
#   via: { tasmota: tasmota_kettle }             Tasmota MQTT topic
#   via: { shelly: 192.168.86.50, channel: 0 }   Shelly Gen2+ (add gen: 1 for older)
#   via: { hue: 3 }                              Hue light id (group: true for a room)
#   via: { wled: 192.168.86.60 }                 WLED strip
#   via: { http: { on: <url>, off: <url>, state: { url: <url>, on: path.to.value } } }
#   via: { adapter: myplug }                     your own config/devices/myplug.js
# See the README for every option.

# mqtt:                                  # for zigbee2mqtt, tasmota and mqtt devices
#   url: mqtt://192.168.86.27:1883
#   username: homepage
#   password: secret
# hue:                                   # Philips Hue bridge
#   bridge: 192.168.86.x
#   key: your-app-key

devices:
  - { name: Ceiling light, room: living_dining, type: light, via: virtual }
  - { name: Floor lamp, room: living_dining, type: light, via: virtual }
  - { name: TV, room: living_dining, type: switch, icon: 📺, via: virtual }
  - { name: Heating, room: living_dining, type: climate, via: virtual, state: { temperature: 19.5, target: 20 } }
  - { name: Kitchen lights, room: kitchen, type: light, dimmable: false, via: virtual }
  - { name: Under-cabinet lights, room: kitchen, type: light, via: virtual }
  - { name: Kettle, room: kitchen, type: switch, icon: ☕, via: virtual }
  - { name: Kitchen sensor, room: kitchen, type: sensor, via: virtual, state: { temperature: 20.8, humidity: 58 } }
  - { name: Hall light, room: hall, type: light, dimmable: false, via: virtual }
  - { name: Landing light, room: landing, type: light, via: virtual }
  - { name: Ceiling light, id: bedroom_1_light, room: bedroom_1, type: light, via: virtual }
  - { name: Bedside lamp, room: bedroom_1, type: light, via: virtual }
  - { name: Blind, room: bedroom_1, type: cover, via: virtual }
  - { name: Bedroom 1 sensor, room: bedroom_1, type: sensor, via: virtual, state: { temperature: 18.9, humidity: 52 } }
  - { name: Ceiling light, id: bedroom_2_light, room: bedroom_2, type: light, via: virtual }
  - { name: Bedroom 2 sensor, room: bedroom_2, type: sensor, via: virtual, state: { temperature: 19.2 } }
  - { name: Ceiling light, id: bedroom_3_light, room: bedroom_3, type: light, via: virtual }
  - { name: Night light, room: bedroom_3, type: light, via: virtual, state: { brightness: 20 } }
  - { name: Bathroom light, room: bathroom, type: light, dimmable: false, via: virtual }
  - { name: Extractor fan, room: bathroom, type: fan, via: virtual }
  - { name: Bathroom sensor, room: bathroom, type: sensor, via: virtual, state: { temperature: 21.4, humidity: 71 } }
  - { name: Garden lights, room: garden, type: switch, icon: 🌳, via: virtual }

# One-tap scenes. Each action targets a device, a room (optionally one
# type), or all devices of a type (* = everything with all_off).
# set: on, off, toggle, or { on, brightness, target, position, command }.
# "All off" is always there.
scenes:
  - name: Morning
    icon: ☀️
    actions:
      - { device: kitchen_lights, set: on }
      - { device: under_cabinet_lights, set: { brightness: 80 } }
      - { device: heating, set: { target: 20 } }
  - name: Film night
    icon: 🎬
    actions:
      - { room: living_dining, type: light, set: off }
      - { device: floor_lamp, set: { brightness: 25 } }
      - { device: tv, set: on }
  - name: Bedtime
    icon: 🌙
    actions:
      - { all: '*', set: off }
      - { device: landing_light, set: { brightness: 15 } }
      - { device: night_light, set: { brightness: 20 } }
      - { device: heating, set: { target: 17 } }

# Weather location (Open-Meteo, no key needed). Set to your house.
weather:
  latitude: 51.5074
  longitude: -0.1278
  units: metric            # metric or imperial

# Calendars as ICS links. Google: Calendar settings > your calendar >
# "Secret address in iCal format". Add person: <id> to colour by owner.
calendars:
  - name: Bank holidays
    url: https://www.gov.uk/bank-holidays/england-and-wales.ics
    color: '#9b8afb'
  # - name: Family
  #   url: https://calendar.google.com/calendar/ical/xxxx/private-xxxx/basic.ics
  #   color: '#4f8cff'

# Chores added the first time the app starts. After that, add, edit and
# delete them on screen.
chores:
  - { title: Empty the dishwasher, room: Kitchen, repeat: daily }
  - { title: Make your bed, person: person3, room: Bedroom 3, repeat: daily }
  - { title: Hoover the sitting room, person: person1, room: Sitting / Dining Room, repeat: weekly }
  - { title: Clean the bathroom, person: person2, room: Bathroom, repeat: weekly }
  - { title: Put the bins out, room: Garden, repeat: weekly }
  - { title: Mow the lawn, person: person1, room: Garden, repeat: weekly }

# The server this runs on (192.168.86.27).
server:
  name: Home server
  docker: http://docker-proxy:2375      # the read-only proxy in docker-compose.yml
  # Disk meters. Defaults to the disk holding ./data. To add another disk,
  # mount it into the container in docker-compose.yml and list it here:
  # disks:
  #   - { name: System, path: /app/data }
  #   - { name: Media, path: /media }

# PAGES
# Each page is a 12-column grid, 8 rows tall on a landscape tablet.
# w = columns wide (1-12), h = rows tall. Widgets are files in
# public/widgets/ or your own in config/widgets/ (see README).

pages:
  - title: Home
    icon: 🏠
    widgets:
      - { type: clock, w: 4, h: 3, bare: true }
      - { type: weather, w: 4, h: 3, hours: 0, days: 5 }
      - { type: people, title: Who's home, w: 4, h: 3 }
      - { type: calendar, title: Coming up, w: 4, h: 5, days: 7 }
      - { type: chores, title: Today's chores, w: 5, h: 5 }
      - { type: list, title: Shopping, list: shopping, w: 3, h: 5 }

  - title: Calendar
    icon: 📅
    widgets:
      - { type: calendar, title: Next two weeks, w: 7, h: 8, days: 14 }
      - { type: weather, w: 5, h: 3, hours: 6, days: 0 }
      - { type: meals, title: Meals, w: 5, h: 5 }

  - title: Chores
    icon: 🧹
    widgets:
      - { type: chores, title: Chores, w: 12, h: 8 }

  - title: Lists
    icon: 📝
    widgets:
      - { type: list, title: Shopping, list: shopping, w: 4, h: 8 }
      - { type: list, title: To do, list: todo, placeholder: Add a job…, w: 4, h: 4 }
      - { type: meals, title: Meals this week, w: 4, h: 5, from: week }
      - { type: note, title: Message board, w: 4, h: 4 }
      - type: bins
        title: Bins
        w: 4
        h: 3
        # Set the next collection date for each bin and how often it comes.
        bins:
          - { name: Rubbish, color: '#6b7280', next: '2026-10-14', every: 14 }
          - { name: Recycling, color: '#2563eb', next: '2026-10-21', every: 14 }
          - { name: Garden waste, color: '#16a34a', next: '2026-10-21', every: 14 }

  - title: House
    icon: 🏡
    widgets:
      # Your house plans and 3D model. Replace the files in config/assets/
      # and point these at /assets/... to use new exports.
      - type: house
        w: 12
        h: 8
        floors:
          - { name: Ground floor, plan: /house/ground.svg }
          - { name: First floor, plan: /house/first.svg }
        model: { name: 3D, obj: /house/house.obj, mtl: /house/house.mtl }

  - title: Server
    icon: 🖥️
    widgets:
      - { type: system, title: Server, w: 8, h: 8 }
      - type: links
        title: Links
        w: 4
        h: 8
        items:
          - { name: Router, url: 'http://192.168.86.1', icon: 📶 }
          - { name: BBC Weather, url: 'https://www.bbc.co.uk/weather', icon: 🌦️ }
          # - { name: Plex, url: 'http://192.168.86.27:32400/web', icon: 🎬 }

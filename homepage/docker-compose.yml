# Family homepage. On the server:  docker compose up -d --build
# Then open http://192.168.86.27:8080

services:
  homepage:
    build: .
    container_name: family-homepage
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/London
    volumes:
      - ./config:/app/config    # homepage.yaml, your own widgets, images
      - ./data:/app/data        # lists, chores, notes (back this up)
    depends_on:
      - docker-proxy

  # Lets the homepage read container stats without giving it the Docker
  # socket. Only read-only container calls are allowed, and the port is
  # not published outside this compose network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: family-homepage-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

# FAMILY HUB
# Button Card Templates
# Large, touch-friendly components for the wall tablet.
# Loaded automatically with the rest of templates/button-card/.


# Navigation Button
# Set the destination with tap_action in the card itself.

family_nav:
  show_name: true
  show_icon: true
  show_state: false
  styles:
    card:
      - height: 72px
      - border-radius: 0
      - padding: 0
      - background-color: var(--card-background-color)
      - color: var(--primary-text-color)
    grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: min-content min-content
      - grid-template-rows: 1fr
      - justify-content: center
      - align-items: center
      - column-gap: 12px
    icon:
      - width: 28px
    name:
      - font-size: 18px
      - font-weight: 600
      - text-transform: uppercase
      - letter-spacing: 1px


# Section Title
# Pass the text with name: on the card.

family_title:
  show_name: true
  show_icon: false
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - box-shadow: none
      - padding: 8px 0 4px
    name:
      - font-size: 20px
      - font-weight: 700
      - text-transform: uppercase
      - letter-spacing: 2px
      - opacity: 0.7
      - justify-self: start
